<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NaslumSynth</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🔴 NaslumSynth</h1>

    <div class="toolbar">

        <select id="preset"></select>

        <select id="waveform">
            <option value="sine">Sine</option>
            <option value="square">Square</option>
            <option value="triangle">Triangle</option>
            <option value="sawtooth">Saw</option>
        </select>

        <input id="volume" type="range" min="0" max="100" value="70">

        <input id="attack" type="range" min="0.001" max="2" step="0.001" value="0.01">
        <input id="decay" type="range" min="0.001" max="2" step="0.001" value="0.2">
        <input id="sustain" type="range" min="0" max="1" step="0.01" value="0.7">
        <input id="release" type="range" min="0.001" max="3" step="0.01" value="0.3">

    </div>
</header>

<main>

<div class="fx-panel">
    <label>Reverb <input id="reverb" type="range" min="0" max="1" step="0.01" value="0.3"></label>
    <label>Delay <input id="delay" type="range" min="0" max="1" step="0.01" value="0.25"></label>
    <label>Feedback <input id="feedback" type="range" min="0" max="0.9" step="0.01" value="0.25"></label>
    <label>Distortion <input id="distortion" type="range" min="0" max="100" step="1" value="30"></label>
</div>

<canvas id="viz" width="900" height="150"></canvas>

<div id="keyboard"></div>

</main>

<script src="presets.js"></script>
<script src="fx.js"></script>
<script src="fx_ui.js"></script>
<script src="synth.js"></script>
<script src="script.js"></script>
<script src="visualizer.js"></script>

</body>
</html>
